<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EFKtime</title>
<meta name="theme-color" content="#071427">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="assets/icons/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EFKtime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header class="app-header">
  <img src="assets/logo.png" alt="EFK Football Application" class="logo">
  <h1>フットサルタイマー</h1>
</header>

<main class="layout">

  <!-- ===== メインタイマー ===== -->
  <section class="panel main-timer" id="mainTimerPanel">
    <div class="panel-title">メインタイマー</div>

    <div class="mode-switch" role="group" aria-label="タイマーモード">
      <button class="mode-btn active" data-mode="alert">カウントダウン</button>
      <button class="mode-btn" data-mode="silent">ノーマル</button>
    </div>

    <div class="main-display" id="mainDisplay">02:00</div>

    <div class="presets" id="mainPresets">
      <button class="preset-btn" data-seconds="60">1分</button>
      <button class="preset-btn" data-seconds="120">2分</button>
      <button class="preset-btn" data-seconds="150">2分30秒</button>
      <button class="preset-btn" data-seconds="180">3分</button>
      <button class="preset-btn" data-seconds="300">5分</button>
    </div>

    <details class="custom-time" id="mainCustomDetails">
      <summary>自由に時間を設定する（スクロール）</summary>
      <div class="wheel-picker" id="mainWheelPicker">
        <div class="wheel-col" data-unit="min" id="mainWheelMin"></div>
        <div class="wheel-sep">:</div>
        <div class="wheel-col" data-unit="sec" id="mainWheelSec"></div>
        <div class="wheel-highlight"></div>
      </div>
      <button class="apply-btn" id="mainApplyCustom">この時間にする</button>
    </details>

    <div class="controls">
      <button class="ctrl-btn start" id="mainStart">スタート</button>
      <button class="ctrl-btn pause" id="mainPause" disabled>一時停止</button>
      <button class="ctrl-btn reset" id="mainReset">リセット</button>
    </div>
  </section>

  <div class="bottom-row">
    <!-- ===== 得点数 ===== -->
    <section class="panel score-board">
      <div class="panel-title">得点数</div>
      <div class="teams">
        <div class="team" data-team="home">
          <div class="team-name" contenteditable="true" spellcheck="false">HOME</div>
          <div class="score" id="scoreHome">0</div>
          <div class="score-btns">
            <button class="score-btn minus" data-team="home" data-delta="-1">−</button>
            <button class="score-btn plus" data-team="home" data-delta="1">＋</button>
          </div>
        </div>
        <div class="team-divider">-</div>
        <div class="team" data-team="away">
          <div class="team-name" contenteditable="true" spellcheck="false">AWAY</div>
          <div class="score" id="scoreAway">0</div>
          <div class="score-btns">
            <button class="score-btn minus" data-team="away" data-delta="-1">−</button>
            <button class="score-btn plus" data-team="away" data-delta="1">＋</button>
          </div>
        </div>
      </div>
      <button class="reset-score-btn" id="scoreReset">得点リセット</button>
    </section>

    <!-- ===== サブタイマー ===== -->
    <section class="panel sub-timer">
      <div class="panel-title">サブタイマー</div>
      <div class="sub-display" id="subDisplay">01:00</div>
      <div class="presets sub-presets" id="subPresets">
        <button class="preset-btn small" data-seconds="60">1分</button>
        <button class="preset-btn small" data-seconds="120">2分</button>
        <button class="preset-btn small" data-seconds="150">2分30秒</button>
        <button class="preset-btn small" data-seconds="180">3分</button>
        <button class="preset-btn small" data-seconds="300">5分</button>
      </div>
      <div class="controls small-controls">
        <button class="ctrl-btn small start" id="subStart">スタート</button>
        <button class="ctrl-btn small pause" id="subPause" disabled>一時停止</button>
        <button class="ctrl-btn small reset" id="subReset">リセット</button>
      </div>
    </section>
  </div>

</main>

<script src="script.js?v=6"></script>
</body>
</html>
