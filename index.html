<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EFK football Application</title>
<meta name="theme-color" content="#0a1710" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #0a1710; color: #f4f7f2;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 420px; width: 100%; padding: 32px 20px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 24px; text-align: center; }
  .card {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px;
    background: rgba(255,255,255,0.04);
  }
  .card .name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .card .desc { font-size: 13px; color: #9fb5a6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>EFK football Application</h1>
  <a class="card" href="./timer/">
    <div class="name">⏱ EFKtime</div>
    <div class="desc">フットサル用タイマー &amp; スコア表示</div>
  </a>
  <a class="card" href="./tactics/">
    <div class="name">📋 EFKtac</div>
    <div class="desc">戦術ボード</div>
  </a>
</div>
</body>
</html>
