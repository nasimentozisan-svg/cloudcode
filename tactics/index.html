<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #0a1710; color: #f4f7f2;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    overscroll-behavior: none;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 12px 40px; }
  .eyebrow { font-size: 10.5px; letter-spacing: 0.18em; color: #5f8f6f; font-weight: 700; margin-bottom: 2px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.01em; }

  .toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .toolbar-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .toolbar-label { font-size: 10.5px; color: #7c9484; font-weight: 700; width: 100%; margin-bottom: -2px; letter-spacing: 0.04em; }
  .btn {
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: #e5e7eb;
    cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn.active { background: #F2B705; border-color: #F2B705; color: #0b0d10; }
  .btn.warn { border-color: #EE6C4D; color: #EE6C4D; }
  .btn.gold-outline { border-color: #F2B705; color: #F2B705; background: rgba(242,183,5,0.08); }
  .swatch { width: 16px; height: 16px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.active { border-color: #fff; }

  .board-stage {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 10px; display: flex; justify-content: center;
    overflow: hidden; position: relative;
  }
  #court-svg {
    display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; border-radius: 6px;
    transform-origin: 0 0;
  }

  .roster-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #9fb5a6; flex-wrap: wrap; }
  .roster-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .roster-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .hint { font-size: 11px; color: #7c9484; margin-top: 8px; line-height: 1.6; }
  .saving-tag { font-size: 10.5px; color: #8fae9a; opacity: 0; transition: opacity .2s; }
  .saving-tag.show { opacity: 1; }
  .error-banner {
    background: rgba(238,108,77,0.15); border: 1px solid #EE6C4D; color: #EE6C4D; padding: 9px 12px;
    border-radius: 10px; font-size: 12px; margin-bottom: 12px; display: none;
  }
  .fab-mode {
    position: fixed; right: 18px; bottom: 22px; z-index: 60;
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: #F2B705; color: #0b0d10; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5); cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .fab-mode:active { transform: scale(0.94); }
  .fab-mode.draw-mode { background: #3FA7D6; }
  .fab-label {
    position: fixed; right: 18px; bottom: 90px; z-index: 60;
    background: rgba(11,13,16,0.85); color: #f4f7f2; font-size: 10.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  .fab-label.show { opacity: 1; }
</style>
</head>

  // CK(コーナーキック)表示に切り替えたときの初期配置

  function ckPos(rx, ry) { return { x: FULL_W - ry, y: rx }; }

    ];
  }
  function ckBallPos() { var p = ckPos(19, 19); return { cx: p.x, cy: p.y }; }

  var state = {
    viewMode: "full", // full | ck
    zone4lane: false,
    zone3lane: false,
    zone3zone: false,
    zoneGoalSq: false,
    mode: "move", // move | draw
    magnetMode: false,
    arrowColor: "#f4f7f2",
    players: defaultPlayers(),
    ball: { cx: FULL_W / 2, cy: FULL_H / 2 },
    arrows: [] // { color, points: [[x,y],...] }
  };

  var CK_DEPTH_M = 10;
  var CK_DEPTH_PX = CK_DEPTH_M * SCALE; // 120 (ゴールライン〜10m)

  var svg = document.getElementById("court-svg");

  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- 永続化(廃止: ログイン不要にするため、保存はこのタブを開いている間だけ) ----
  function showError(msg) {
    var b = document.getElementById("error-banner");
    b.textContent = msg;
    b.style.display = "block";
  }
  function hideError() {
    var b = document.getElementById("error-banner");
    b.style.display = "none";
    b.textContent = "";
  }

  function persist() {
    // 保存機能なし: ログイン不要で誰でも開けるようにするため、あえて何もしない
  }

  function load() {
    buildBoard();
  }

  // ---- コート描画 ----
  var courtLayer, zoneLayer, arrowLayer, playerLayer, ballLayer, rootGroup;

  function buildBoard() {
    svg.innerHTML = "";
    markerIds = {}; // innerHTML初期化でdefs内のマーカーも消えるため、キャッシュも合わせてリセットする

    var isCk = state.viewMode === "ck";
    // CK表示: 上部(赤GKがいる側、ゴール前10m)を90度回転して表示。
    // オールコートと同じ縮尺(px/unit)を保つため、幅を50%にしてズームさせない。
    var vbW = isCk ? CK_DEPTH_PX : FULL_W;   // 120 or 240
    var vbH = isCk ? FULL_W : FULL_H;         // 240 or 480

    svg.setAttribute("viewBox", "0 0 " + vbW + " " + vbH);
    // iOS Safariはviewboxのみだと縦横比の再計算に失敗することがあるため、
    // width/height属性とaspect-ratioを明示的に設定して確実に反映させる
    svg.setAttribute("width", vbW);
    svg.setAttribute("height", vbH);
    svg.style.aspectRatio = vbW + " / " + vbH;
    svg.style.width = "100%";

    rootGroup = el("g", {});
    if (isCk) {
      // 上部(y:0〜10m)を90度回転。ゴールライン(y=0)を左端にする。
      rootGroup.setAttribute("transform", "matrix(0,-1,1,0,0," + FULL_W + ")");
    }
    svg.appendChild(rootGroup);

    courtLayer = el("g", {});
    zoneLayer = el("g", {});
    arrowLayer = el("g", {});
    playerLayer = el("g", {});
    ballLayer = el("g", {});
    rootGroup.appendChild(courtLayer);
    rootGroup.appendChild(zoneLayer);
    rootGroup.appendChild(arrowLayer);
    rootGroup.appendChild(playerLayer);
    rootGroup.appendChild(ballLayer);

    drawCourt();
    drawZones();
    drawArrows();
    drawPlayers();
    drawBall();
    setupBoardPointerEvents();
    resetViewTransform();
  }

  function drawCourt() {
    courtLayer.appendChild(el("rect", {
      x: 0, y: 0, width: FULL_W, height: FULL_H, fill: "#0f3d24"
    }));
    // 芝目
    for (var i = 0; i < LENGTH_M; i += 2) {
      courtLayer.appendChild(el("rect", {
        x: 0, y: i * SCALE, width: FULL_W, height: SCALE * 2,
        fill: i % 4 === 0 ? "rgba(255,255,255,0.02)" : "transparent"
      }));
    }

    var lineStyle = { stroke: "#eef3ee", "stroke-width": 1.4, fill: "none", opacity: 0.9 };

    // 外枠
    courtLayer.appendChild(el("rect", Object.assign({ x: 3, y: 3, width: FULL_W - 6, height: FULL_H - 6 }, lineStyle)));
    // ハーフウェイライン
    courtLayer.appendChild(el("line", Object.assign({ x1: 3, y1: FULL_H / 2, x2: FULL_W - 3, y2: FULL_H / 2 }, lineStyle)));
    // センターサークル
    courtLayer.appendChild(el("circle", Object.assign({ cx: FULL_W / 2, cy: FULL_H / 2, r: 3 * SCALE }, lineStyle)));
    courtLayer.appendChild(el("circle", Object.assign({ cx: FULL_W / 2, cy: FULL_H / 2, r: 1.2 }, { fill: "#eef3ee" })));

    [0, FULL_H].forEach(function (goalY, idx) {
      var dir = idx === 0 ? 1 : -1;
      // ゴール(簡易)
      courtLayer.appendChild(el("rect", {
        x: FULL_W / 2 - 1.5 * SCALE, y: goalY - (idx === 0 ? 0 : 0.9 * SCALE), width: 3 * SCALE, height: 0.9 * SCALE,
        fill: "none", stroke: "#eef3ee", "stroke-width": 1.4, opacity: 0.9
      }));
      // ペナルティエリア(2つの1/4円 + 直線, ゴールポストを中心に半径6m)
      var r = 6 * SCALE;
      var postHalf = 1.5 * SCALE;
      var leftPost = FULL_W / 2 - postHalf;
      var rightPost = FULL_W / 2 + postHalf;
      var frontY = goalY + dir * r;
      var sweep = dir === 1 ? 0 : 1;
      var path =
        "M " + (leftPost - r) + " " + goalY + " " +
        "A " + r + " " + r + " 0 0 " + sweep + " " + leftPost + " " + frontY + " " +
        "L " + rightPost + " " + frontY + " " +
        "A " + r + " " + r + " 0 0 " + sweep + " " + (rightPost + r) + " " + goalY;
      courtLayer.appendChild(el("path", { d: path, fill: "none", stroke: "#eef3ee", "stroke-width": 1.4, opacity: 0.9 }));
      // ペナルティマーク
      courtLayer.appendChild(el("circle", { cx: FULL_W / 2, cy: goalY + dir * 6 * SCALE, r: 1.2, fill: "#eef3ee" }));
      courtLayer.appendChild(el("circle", { cx: FULL_W / 2, cy: goalY + dir * 10 * SCALE, r: 1.2, fill: "#eef3ee" }));
    });
  }

  function drawZones() {
    zoneLayer.innerHTML = "";
    if (state.zone4lane) {
      var lw = FULL_W / 4;
      for (var i = 1; i < 4; i++) {
        zoneLayer.appendChild(el("line", {
          x1: lw * i, y1: 4, x2: lw * i, y2: FULL_H - 4,
          stroke: "#F2B705", "stroke-width": 1.2, "stroke-dasharray": "5,4", opacity: 0.65
        }));
      }
    }
    if (state.zone3lane) {
      var lw3 = FULL_W / 3;
      for (var j = 1; j < 3; j++) {
        zoneLayer.appendChild(el("line", {
          x1: lw3 * j, y1: 4, x2: lw3 * j, y2: FULL_H - 4,
          stroke: "#C874D9", "stroke-width": 1.2, "stroke-dasharray": "5,4", opacity: 0.65
        }));
      }
    }
    if (state.zone3zone) {
      var zh = FULL_H / 3;
      var labels = ["ゾーン1", "ゾーン2", "ゾーン3"];
      for (var k = 0; k < 3; k++) {
        if (k > 0) {
          zoneLayer.appendChild(el("line", {
            x1: 4, y1: zh * k, x2: FULL_W - 4, y2: zh * k,
            stroke: "#3FA7D6", "stroke-width": 1.2, "stroke-dasharray": "5,4", opacity: 0.65
          }));
        }
        var t = el("text", {
          x: 8, y: zh * k + 16, fill: "#3FA7D6", "font-size": 9, "font-weight": 700, opacity: 0.85
        });
        if (state.viewMode === "ck") {
          t.setAttribute("transform", "rotate(90 8 " + (zh * k + 16) + ")");
        }
        t.textContent = labels[k];
        zoneLayer.appendChild(t);
      }
    }
    if (state.zoneGoalSq) {
      var sq = 10 * SCALE;
      zoneLayer.appendChild(el("rect", {
        x: FULL_W / 2 - sq / 2, y: 0, width: sq, height: sq,
        fill: RED, opacity: 0.12
      }));
      zoneLayer.appendChild(el("rect", {
        x: FULL_W / 2 - sq / 2, y: FULL_H - sq, width: sq, height: sq,
        fill: BLUE, opacity: 0.12
      }));
    }
  }

  // ---- 矢印 ----
  function catmullRomToBezierPath(points) {
    if (points.length < 2) return "";
    if (points.length === 2) {
      return "M " + points[0][0] + " " + points[0][1] + " L " + points[1][0] + " " + points[1][1];
    }
    var d = "M " + points[0][0] + " " + points[0][1] + " ";
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i - 1] || points[i];
      var p1 = points[i];
      var p2 = points[i + 1];
      var p3 = points[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6;
      var c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6;
      var c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += "C " + c1x + " " + c1y + ", " + c2x + " " + c2y + ", " + p2[0] + " " + p2[1] + " ";
    }
    return d;
  }

  function simplifyPoints(points, minDist) {
    if (points.length < 3) return points;
    var out = [points[0]];
    for (var i = 1; i < points.length; i++) {
      var last = out[out.length - 1];
      var dx = points[i][0] - last[0], dy = points[i][1] - last[1];
      if (Math.sqrt(dx * dx + dy * dy) >= minDist) out.push(points[i]);
    }
    if (out[out.length - 1] !== points[points.length - 1]) out.push(points[points.length - 1]);
    return out;
  }

  var markerIds = {};
  function ensureArrowMarker(color, vs) {
    var id = "arrowhead-" + color.replace("#", "") + "-" + Math.round(vs * 100);
    if (markerIds[id]) return id;
    var defs = svg.querySelector("defs") || (function () {
      var d = el("defs", {});
      svg.insertBefore(d, svg.firstChild);
      return d;
    })();
    var marker = el("marker", {
      id: id, viewBox: "0 0 10 10", refX: 8, refY: 5,
      markerWidth: 6 * vs, markerHeight: 6 * vs, orient: "auto-start-reverse"
    });
    marker.appendChild(el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }));
    defs.appendChild(marker);
    markerIds[id] = true;
    return id;
  }

  function drawArrows() {
    arrowLayer.innerHTML = "";
    // CKは縮尺が2倍で表示されるため、選手と同様に矢印も見た目サイズを合わせて縮小する
    var vs = state.viewMode === "ck" ? 0.5 : 1;
    state.arrows.forEach(function (a) {
      var pts = simplifyPoints(a.points, 3);
      var d = catmullRomToBezierPath(pts);
      var markerId = ensureArrowMarker(a.color, vs);
      // 緑など背景に馴染みやすい色でも見やすいよう、濃色の縁取りを下に敷く
      arrowLayer.appendChild(el("path", {
        d: d, fill: "none", stroke: "#0b0d10", "stroke-width": (2.6 + 2) * vs,
        "stroke-linecap": "round", opacity: 0.55
      }));
      arrowLayer.appendChild(el("path", {
        d: d, fill: "none", stroke: a.color, "stroke-width": 2.6 * vs,
        "stroke-linecap": "round", "marker-end": "url(#" + markerId + ")"
      }));
    });
  }

  // ---- 選手 ----
  function drawPlayers() {
    playerLayer.innerHTML = "";
    // CKは倍のズームで表示されるため、選手の見た目サイズが変わらないよう半分の縮尺で描く
    var vs = state.viewMode === "ck" ? 0.5 : 1;
    state.players.forEach(function (p) {
      var g = el("g", { "data-id": p.id, style: "cursor:grab;" });
      g.appendChild(el("circle", {
        cx: p.cx, cy: p.cy, r: 10.5 * vs, fill: p.color, stroke: "#0b0d10", "stroke-width": 1.4 * vs
      }));
      var t = el("text", {
        x: p.cx, y: p.cy + 3.6 * vs, "text-anchor": "middle", "font-size": 10.5 * vs, "font-weight": 800,
        fill: p.isGK && p.color === RED ? "#fff" : (p.color === GREEN ? "#06251b" : (p.color === GRAY ? "#1c1f22" : "#04202c")),
        style: "pointer-events:none;"
      });
      if (state.viewMode === "ck") {
        t.setAttribute("transform", "rotate(90 " + p.cx + " " + p.cy + ")");
      }
      t.textContent = p.isGK ? "G" : p.num;
      g.appendChild(t);
      playerLayer.appendChild(g);
    });
  }

  // ---- ボール ----
  function drawBall() {
    ballLayer.innerHTML = "";
    var b = state.ball;
    var vs = state.viewMode === "ck" ? 0.5 : 1;
    var g = el("g", { "data-id": "ball", style: "cursor:grab;" });
    g.appendChild(el("circle", {
      cx: b.cx, cy: b.cy, r: 6 * vs, fill: "#f4f7f2", stroke: "#0b0d10", "stroke-width": 1.2 * vs
    }));
    // 簡易ペンタゴン柄
    g.appendChild(el("path", {
      d: "M " + (b.cx - 3 * vs) + " " + (b.cy - 1.6 * vs) + " L " + b.cx + " " + (b.cy - 3.6 * vs) + " L " + (b.cx + 3 * vs) + " " + (b.cy - 1.6 * vs) +
         " L " + (b.cx + 1.8 * vs) + " " + (b.cy + 1.8 * vs) + " L " + (b.cx - 1.8 * vs) + " " + (b.cy + 1.8 * vs) + " Z",
      fill: "#0b0d10", opacity: 0.85, style: "pointer-events:none;"
    }));
    ballLayer.appendChild(g);
  }

  // ---- ポインター操作 ----
  var dragTarget = null;
  var dragIsBall = false;
  var dragExcluded = null; // ドラッグ開始時点で既に重なっていたマーカー(このドラッグ中は追従させない)
  var dragAttached = null; // ドラッグ中に新しく触れて、一緒に動くようになったマーカー
  var drawingPoints = null;
  var currentArrowPreview = null;
  var currentArrowPreviewHalo = null;

  function markerRadius(m) {
    var vs = state.viewMode === "ck" ? 0.5 : 1;
    return (m === state.ball ? 6 : 10.5) * vs;
  }
  function isTouchingMarker(m1, m2) {
    var d = Math.hypot(m1.cx - m2.cx, m1.cy - m2.cy);
    return d < (markerRadius(m1) + markerRadius(m2)) * 1.15;
  }

  function svgPoint(evt) {
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    var rx = (clientX - rect.left) / rect.width * vb.width + vb.x;
    var ry = (clientY - rect.top) / rect.height * vb.height + vb.y;
    if (state.viewMode === "ck") {
      // buildBoardの回転(matrix(0,-1,1,0,0,FULL_W))の逆変換: 元のデータ座標系に戻す
      return [FULL_W - ry, rx];
    }
    return [rx, ry];
  }

  function distToSegment(p, v, w) {
    var l2 = (w[0] - v[0]) * (w[0] - v[0]) + (w[1] - v[1]) * (w[1] - v[1]);
    if (l2 === 0) return Math.hypot(p[0] - v[0], p[1] - v[1]);
    var t = ((p[0] - v[0]) * (w[0] - v[0]) + (p[1] - v[1]) * (w[1] - v[1])) / l2;
    t = Math.max(0, Math.min(1, t));
    var projX = v[0] + t * (w[0] - v[0]);
    var projY = v[1] + t * (w[1] - v[1]);
    return Math.hypot(p[0] - projX, p[1] - projY);
  }

  function findArrowAt(pt) {
    for (var i = state.arrows.length - 1; i >= 0; i--) {
      var pts = state.arrows[i].points;
      for (var j = 0; j < pts.length - 1; j++) {
        if (distToSegment(pt, pts[j], pts[j + 1]) < 9) return i;
      }
    }
    return -1;
  }

  function findPlayerAt(pt) {
    // ボールを優先的に拾う(選手と重なっている場合、ボールを動かしたいことが多いため)
    var bdx = state.ball.cx - pt[0], bdy = state.ball.cy - pt[1];
    if (Math.sqrt(bdx * bdx + bdy * bdy) < 12) {
      return { isBall: true };
    }
    var best = null, bestDist = 16;
    state.players.forEach(function (p) {
      var dx = p.cx - pt[0], dy = p.cy - pt[1];
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestDist) { bestDist = dist; best = p; }
    });
    return best;
  }

  // ---- 拡大縮小(2本指ピンチズーム・パン) ----
  var VIEW_MIN_SCALE = 0.4, VIEW_MAX_SCALE = 4;
  var viewScale = 1, viewTX = 0, viewTY = 0;
  var activePointers = {};
  var pinchStart = null;

  function applyViewTransform() {
    svg.style.transform = "translate(" + viewTX + "px," + viewTY + "px) scale(" + viewScale + ")";
  }
  function resetViewTransform() {
    viewScale = 1; viewTX = 0; viewTY = 0;
    applyViewTransform();
  }
  function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
  function mid(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

  function setupBoardPointerEvents() {
    svg.onpointerdown = function (evt) {
      activePointers[evt.pointerId] = { x: evt.clientX, y: evt.clientY };
      var ids = Object.keys(activePointers);
      // どのケースでも確実にpointerup/cancelを拾えるよう、必ずキャプチャしておく
      // (捕まえ損ねると指を離してもactivePointersに残り、次のタップが誤って2本指扱いになるバグの原因になる)
      try { svg.setPointerCapture(evt.pointerId); } catch (e) {}

      if (ids.length === 2) {
        // 2本目の指が触れたらピンチ操作へ切り替え、進行中の1本指操作は中断する
        if (dragTarget) { dragTarget = null; dragIsBall = false; dragExcluded = null; dragAttached = null; }
        if (drawingPoints) {
          if (currentArrowPreview && currentArrowPreview.parentNode) arrowLayer.removeChild(currentArrowPreview);
          if (currentArrowPreviewHalo && currentArrowPreviewHalo.parentNode) arrowLayer.removeChild(currentArrowPreviewHalo);
          drawingPoints = null;
          currentArrowPreview = null;
          currentArrowPreviewHalo = null;
        }
        var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
        var stageRect = svg.parentElement.getBoundingClientRect();
        var mid0 = mid(p1, p2);
        pinchStart = {
          dist: dist(p1, p2),
          scale: viewScale,
          contentX: (mid0.x - stageRect.left - viewTX) / viewScale,
          contentY: (mid0.y - stageRect.top - viewTY) / viewScale,
          stageRect: stageRect
        };
        evt.preventDefault();
        return;
      }
      if (ids.length > 2) { evt.preventDefault(); return; }

      // ---- ここから通常の1本指操作 ----
      var pt = svgPoint(evt);
      if (state.mode === "move") {
        var p = findPlayerAt(pt);
        if (p) {
          dragIsBall = !!p.isBall;
          dragTarget = dragIsBall ? state.ball : p;
          dragExcluded = new Set();
          dragAttached = new Set();
          if (state.magnetMode) {
            state.players.concat([state.ball]).forEach(function (m) {
              if (m === dragTarget) return;
              if (isTouchingMarker(dragTarget, m)) dragExcluded.add(m);
            });
          }
          svg.setPointerCapture(evt.pointerId);
        }
      } else if (state.mode === "draw") {
        var hitIdx = findArrowAt(pt);
        if (hitIdx !== -1) {
          // 既に描かれた矢印に触れたら削除する
          state.arrows.splice(hitIdx, 1);
          drawArrows();
          evt.preventDefault();
          return;
        }
        var startColor = state.arrowColor;
        var touchedPlayer = findPlayerAt(pt);
        if (touchedPlayer) {
          startColor = touchedPlayer.isBall ? "#f4f7f2" : touchedPlayer.color;
          state.arrowColor = startColor;
          Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (s) {
            s.classList.toggle("active", s.getAttribute("data-color") === startColor);
          });
        }
        drawingPoints = [pt];
        var pvs = state.viewMode === "ck" ? 0.5 : 1;
        currentArrowPreviewHalo = el("path", {
          d: "", fill: "none", stroke: "#0b0d10", "stroke-width": (2.6 + 2) * pvs,
          "stroke-linecap": "round", opacity: 0.45
        });
        currentArrowPreview = el("path", {
          d: "", fill: "none", stroke: startColor, "stroke-width": 2.6 * pvs,
          "stroke-linecap": "round", opacity: 0.85
        });
        arrowLayer.appendChild(currentArrowPreviewHalo);
        arrowLayer.appendChild(currentArrowPreview);
        svg.setPointerCapture(evt.pointerId);
      }
      evt.preventDefault();
    };

    svg.onpointermove = function (evt) {
      if (activePointers[evt.pointerId]) {
        activePointers[evt.pointerId] = { x: evt.clientX, y: evt.clientY };
      }
      var ids = Object.keys(activePointers);

      if (ids.length >= 2 && pinchStart) {
        var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
        var newDist = dist(p1, p2);
        var m = mid(p1, p2);
        var newScale = Math.min(VIEW_MAX_SCALE, Math.max(VIEW_MIN_SCALE, pinchStart.scale * (newDist / pinchStart.dist)));
        var baseW = pinchStart.stageRect.width;
        var baseH = pinchStart.stageRect.height;
        var newTX = (m.x - pinchStart.stageRect.left) - newScale * pinchStart.contentX;
        var newTY = (m.y - pinchStart.stageRect.top) - newScale * pinchStart.contentY;
        var minTX = Math.min(0, baseW - baseW * newScale), maxTX = Math.max(0, baseW - baseW * newScale);
        var minTY = Math.min(0, baseH - baseH * newScale), maxTY = Math.max(0, baseH - baseH * newScale);
        newTX = Math.max(minTX, Math.min(maxTX, newTX));
        newTY = Math.max(minTY, Math.min(maxTY, newTY));
        viewScale = newScale; viewTX = newTX; viewTY = newTY;
        applyViewTransform();
        evt.preventDefault();
        return;
      }

      if (dragTarget) {
        var pt = svgPoint(evt);
        var newX = Math.max(6, Math.min(FULL_W - 6, pt[0]));
        var newY = Math.max(6, Math.min(FULL_H - 6, pt[1]));
        var dx = newX - dragTarget.cx, dy = newY - dragTarget.cy;
        dragTarget.cx = newX;
        dragTarget.cy = newY;

        // 既に一緒に動いているマーカーは同じ分だけ追従させる
        dragAttached.forEach(function (m) { m.cx += dx; m.cy += dy; });
        // 新しく触れたマーカーがあれば、このドラッグ中だけ一緒に動く対象に加える(マグネットモード時のみ)
        if (state.magnetMode) {
          state.players.concat([state.ball]).forEach(function (m) {
            if (m === dragTarget || dragExcluded.has(m) || dragAttached.has(m)) return;
            if (isTouchingMarker(dragTarget, m)) dragAttached.add(m);
          });
        }

        drawPlayers();
        drawBall();
        evt.preventDefault();
      } else if (drawingPoints) {
        var pt2 = svgPoint(evt);
        var last = drawingPoints[drawingPoints.length - 1];
        var dx = pt2[0] - last[0], dy = pt2[1] - last[1];
        if (Math.sqrt(dx * dx + dy * dy) > 1.5) {
          drawingPoints.push(pt2);
          var previewD = catmullRomToBezierPath(simplifyPoints(drawingPoints, 3));
          currentArrowPreview.setAttribute("d", previewD);
          currentArrowPreviewHalo.setAttribute("d", previewD);
        }
        evt.preventDefault();
      }
    };

    svg.onpointerup = function (evt) {
      delete activePointers[evt.pointerId];
      var ids = Object.keys(activePointers);
      if (ids.length < 2) { pinchStart = null; }
      if (ids.length > 0) { return; } // 指がまだ画面に残っている間は選手/矢印の確定処理をしない

      if (dragTarget) {
        dragTarget = null;
        dragIsBall = false;
        dragExcluded = null;
        dragAttached = null;
        persist();
      } else if (drawingPoints) {
        if (drawingPoints.length > 1) {
          state.arrows.push({ color: state.arrowColor, points: simplifyPoints(drawingPoints, 3) });
          persist();
        }
        drawingPoints = null;
        currentArrowPreview = null;
        currentArrowPreviewHalo = null;
        drawArrows();
      }
    };
    svg.onpointercancel = svg.onpointerup;
    svg.onlostpointercapture = function (evt) {
      // 保険: 何らかの理由でpointerupが届かなかった場合でも指の情報を確実に消す
      if (activePointers[evt.pointerId] !== undefined) {
        svg.onpointerup(evt);
      }
    };
  }

  // ---- ツールバー ----
  var fabLabelTimer = null;
  function setMode(mode) {
    state.mode = mode;
    document.getElementById("mode-move").classList.toggle("active", mode === "move");
    document.getElementById("mode-draw").classList.toggle("active", mode === "draw");
    document.getElementById("arrow-controls").style.display = mode === "draw" ? "flex" : "none";

    var fab = document.getElementById("fab-mode-toggle");
    var fabLabel = document.getElementById("fab-label");
    if (mode === "draw") {
      fab.textContent = "✏️";
      fab.classList.add("draw-mode");
      fabLabel.textContent = "✏️ 矢印モード中";
    } else {
      fab.textContent = "🖐";
      fab.classList.remove("draw-mode");
      fabLabel.textContent = "🖐 選手移動中";
    }
    fabLabel.classList.add("show");
    clearTimeout(fabLabelTimer);
    fabLabelTimer = setTimeout(function () { fabLabel.classList.remove("show"); }, 1600);
  }
  document.getElementById("mode-move").addEventListener("click", function () { setMode("move"); });
  document.getElementById("mode-draw").addEventListener("click", function () { setMode("draw"); });
  document.getElementById("fab-mode-toggle").addEventListener("click", function () {
    setMode(state.mode === "move" ? "draw" : "move");
  });

  document.getElementById("magnet-toggle").addEventListener("click", function (evt) {
    state.magnetMode = !state.magnetMode;
    evt.target.classList.toggle("active", state.magnetMode);
  });

  document.getElementById("view-toggle").addEventListener("click", function (evt) {
    state.viewMode = state.viewMode === "full" ? "ck" : "full";
    evt.target.textContent = state.viewMode === "ck" ? "オールコートに戻す" : "CK";
    if (state.viewMode === "ck") {
      state.players = ckFormation();
      state.ball = ckBallPos();
    } else {
      state.players = defaultPlayers();
      state.ball = { cx: FULL_W / 2, cy: FULL_H / 2 };
    }
    state.arrows = [];
    buildBoard();
  });

  function toggleZoneBtn(btnId, key, exclusiveWith) {
    document.getElementById(btnId).addEventListener("click", function () {
      state[key] = !state[key];
      if (state[key] && exclusiveWith) {
        state[exclusiveWith.stateKey] = false;
        document.getElementById(exclusiveWith.btnId).classList.remove("active");
      }
      document.getElementById(btnId).classList.toggle("active", state[key]);
      drawZones();
    });
  }
  toggleZoneBtn("zone-4lane", "zone4lane", { stateKey: "zone3lane", btnId: "zone-3lane" });
  toggleZoneBtn("zone-3lane", "zone3lane", { stateKey: "zone4lane", btnId: "zone-4lane" });
  toggleZoneBtn("zone-3zone", "zone3zone", null);
  toggleZoneBtn("zone-goalsq", "zoneGoalSq", null);

  Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (sw) {
    sw.addEventListener("click", function () {
      state.arrowColor = sw.getAttribute("data-color");
      Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (s) { s.classList.remove("active"); });
      sw.classList.add("active");
    });
  });

  document.getElementById("arrow-undo").addEventListener("click", function () {
    state.arrows.pop();
    drawArrows();
    persist();
  });
  document.getElementById("arrow-clear").addEventListener("click", function () {
    if (state.arrows.length === 0) return;
    state.arrows = [];
    drawArrows();
    persist();
  });
  document.getElementById("reset-formation").addEventListener("click", function () {
    if (state.viewMode === "ck") {
      state.players = ckFormation();
      state.ball = ckBallPos();
    } else {
      state.players = defaultPlayers();
      state.ball = { cx: FULL_W / 2, cy: FULL_H / 2 };
    }
    state.arrows = [];
    drawPlayers();
    drawBall();
    drawArrows();
    persist();
  });

  load();
})();
</script>
</body>
</html>
